name: Java verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['8', '17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode verify
  benchmark-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode -Pbenchmarks -DskipTests package
      - name: Smoke test benchmark jar
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().findtext('{http://maven.apache.org/POM/4.0.0}version'))")
          java -jar "target/benchmarks/thulac4j-${version}-benchmarks.jar" DecoderBenchmark -p length=32 -p labelCount=4 -wi 0 -i 1 -r 1s -f 1
  release-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python3 scripts/download_models.py
      - run: mvn --batch-mode -Prelease,model-tests -Dgpg.skip=true clean verify
      - run: python3 scripts/check_release.py
